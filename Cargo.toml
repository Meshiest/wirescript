[workspace]
members = [
  "crates/cli",
  "crates/lsp",
  "crates/wasm",
  "crates/wirescript",
  "crates/wirescript-ir",
]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.lints.rust]
unsafe_code = "deny"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
elided_lifetimes_in_paths = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
# `cargo llvm-cov` sets `cfg(coverage)`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
if_not_else = "allow"
implicit_hasher = "allow"
items_after_statements = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
single_match_else = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
# Coordinates, colors and operands are named x/y/z, r/g/b, a/b.
many_single_char_names = "allow"
# Constant folding compares exact values against the game's.
float_cmp = "allow"
# Child and test modules take their parent's names with `use super::*`.
wildcard_imports = "allow"
# File extensions are matched exactly; accepting `.WS` would change behaviour.
case_sensitive_file_extension_comparisons = "allow"
# Restriction and nursery lints, chosen one by one.
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
get_unwrap = "warn"
redundant_clone = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
use_self = "warn"

[profile.release]
# Thin LTO for cross-crate inlining on the hot lower/emit/brdb paths.
# (codegen-units deliberately left at default: =1 bought ~15% on `lower`
# but pushed every release relink past a minute.)
lto = "thin"

# The integration tests run the compiler over real `.ws` fixtures, so an
# unoptimized build makes the suite compiler-bound rather than test-bound.
# Measured: `cargo test -p wirescript` run-only 17.1s -> 4.2s, and 43.3s ->
# 20.2s after an edit. Faster on every axis, including incremental rebuild.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[workspace.dependencies]
# CLI
clap = { version = "4.5.40", features = ["derive"] }
thiserror = "2.0.12"

# Pull brdb from the sibling checkout so the microchip + schema work in brdb
# flows straight through without a crates.io publish cycle.
# brdb = { path = "../brdb/crates/brdb", default-features = false }
brdb = { version = "1.0.3", default-features = false }
wirescript = { path = "crates/wirescript", default-features = false }
wirescript-ir = { path = "crates/wirescript-ir", default-features = false }

lasso = { version = "0.7", features = ["multi-threaded"] }
mimalloc = "0.1"
petgraph = "0.7"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
