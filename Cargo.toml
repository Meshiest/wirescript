[workspace]
members = ["crates/cli", "crates/lsp", "crates/wasm", "crates/wirescript"]
resolver = "3"

[profile.release]
# Thin LTO for cross-crate inlining on the hot lower/emit/brdb paths.
# (codegen-units deliberately left at default: =1 bought ~15% on `lower`
# but pushed every release relink past a minute.)
lto = "thin"

# The integration tests run the compiler over real `.ws` fixtures, so an
# unoptimized build makes the suite compiler-bound rather than test-bound.
# Measured: `cargo test -p wirescript` run-only 17.1s -> 4.2s, and 43.3s ->
# 20.2s after an edit. Faster on every axis, including incremental rebuild.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[workspace.dependencies]
# CLI
clap = { version = "4.5.40", features = ["derive"] }
thiserror = "2.0.12"

# Pull brdb from the sibling checkout so the microchip + schema work in brdb
# flows straight through without a crates.io publish cycle.
# brdb = { path = "../brdb/crates/brdb", default-features = false }
brdb = { version = "0.11.0", default-features = false }
wirescript = { path = "crates/wirescript" }
