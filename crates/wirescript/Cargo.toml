[package]
name = "wirescript"
version = "2.3.1"
edition.workspace = true

[[bin]]
name = "wirescript-check"
path = "src/bin/check.rs"

[features]
default = ["brdb-full"]
brdb-full = ["brdb/brdb", "wirescript-ir/brdb-full"]
# The editor's lookups by the text it completes or hovers (the LSP and the
# playground).
editor = []
# Temporary allocation-site profiling (examples/dhat_lower.rs).
dhat-heap = ["dep:dhat"]

[dependencies]
wirescript-ir.workspace = true
brdb = { workspace = true, features = ["brz"] }
rustc-hash.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
petgraph.workspace = true
bitflags = "2"
lasso.workspace = true
# The formatter reads `.editorconfig` (indent, line length, line endings).
ec4rs = "1.2"
dhat = { version = "0.3", optional = true }

# Native-only: global allocator for the check bin + examples (never wasm32).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mimalloc.workspace = true

[dev-dependencies]
wirescript-ir = { workspace = true, features = ["test-internals"] }

[lints]
workspace = true
