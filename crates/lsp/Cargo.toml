[package]
name = "wirescript-lsp"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "wirescript-lsp"
path = "src/main.rs"

[dependencies]
tower-lsp = "0.20"
serde.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
mimalloc.workspace = true
wirescript = { workspace = true, features = ["brdb-full", "editor"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "io-std", "time"] }

# WASI build (wasm32-wasip1-threads), run by VS Code's WebAssembly host.
# No .brdb output there: brdb-full pulls in SQLite.
[target.'cfg(target_family = "wasm")'.dependencies]
wirescript = { workspace = true, features = ["editor"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }

[lints]
workspace = true
