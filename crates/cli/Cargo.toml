[package]
name = "wirescript-cli"
version = "0.1.0"
edition.workspace = true

# The package keeps the `-cli` suffix because the library crate already owns
# the `wirescript` name; the binary users type is just `wirescript`.
[[bin]]
name = "wirescript"
path = "src/main.rs"

[dependencies]
mimalloc.workspace = true
clap.workspace = true
brdb = { workspace = true, features = ["brz", "brdb"] }
wirescript = { workspace = true, features = ["brdb-full"] }

[lints]
workspace = true
