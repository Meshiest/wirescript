[package]
name = "wirescript-ir"
version = "0.1.0"
edition.workspace = true
description = "Brickadia logic-gate IR: build or load a gate graph, lay it out, and assemble it into a .brz/.brdb save"

[features]
default = ["brdb-full"]
# `.brdb` (SQLite) output. Off for wasm32, which only writes `.brz`.
brdb-full = ["brdb/brdb"]
# Layout and emit internals for the wirescript crate's front-end-driven
# backend tests, and `readback` for reading a written save. Enabled only
# through its dev-dependency and by the examples that read a save back.
test-internals = []

[dependencies]
brdb = { workspace = true, features = ["brz"] }
rustc-hash.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
petgraph.workspace = true
lasso.workspace = true

[[example]]
name = "and_gate"
required-features = ["test-internals"]

[lints]
workspace = true
