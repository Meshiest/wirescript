name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ci-v1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      # The whole workspace, not just `-p wirescript`: `crates/lsp`,
      # `crates/wasm` and `crates/cli` have tests of their own.
      - name: Tests
        run: cargo test --workspace

      # Not `-D warnings`: the tree carries a long tail of style warnings that
      # predate this gate. What this catches is clippy's deny-by-default lints
      # (real bug smells like `never_loop`), plus any compile break in a crate
      # `cargo test` does not reach.
      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Doc examples type-check
        run: just doc-check
