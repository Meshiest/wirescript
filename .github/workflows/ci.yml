name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ci-v1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Tests
        run: cargo test -p wirescript

      - name: Doc examples type-check
        run: just doc-check
