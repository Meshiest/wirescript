[book]
title = "Wirescript"
description = "Language reference for Wirescript, which compiles to Brickadia's logic gates."
src = "src"
language = "en"

[build]
build-dir = "book"
# `src/SUMMARY.md` is generated, so a missing page is a bug in the generator
# rather than something to stub out.
create-missing = false

[output.html]
# `ws-snippet.js` adds a Compile button to every named Wirescript example.
# `ws-highlight.js` colors each Wirescript block with the playground editor's
# own tokenizer (Monaco). `ws-drawer.js` adds the
# editor drawer at the bottom of each page. `learn-nav.js` puts the Learn
# series' icons (`learn-icons.js`, generated) in the sidebar.
# `ws-wiring.js` draws the Learn pages' ```wiring diagrams.
additional-js = ["assets/ws-highlight.js", "assets/ws-snippet.js", "assets/ws-drawer.js", "assets/learn-icons.js", "assets/learn-nav.js", "assets/ws-wiring.js"]
# The Monaco token colors, the editor drawer, and the Learn links and sidebar icons.
additional-css = ["assets/ws-highlight.css", "assets/ws-drawer.css", "assets/learn.css"]
default-theme = "navy"
preferred-dark-theme = "navy"
# Every page already carries a `just doc-toc` "Contents" list.
no-section-label = true
git-repository-url = "https://github.com/Meshiest/wirescript"
edit-url-template = "https://github.com/Meshiest/wirescript/edit/main/docs/{path}"

[output.html.fold]
enable = true
level = 0
